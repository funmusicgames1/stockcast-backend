name: StockCast Daily Pipeline

on:
  schedule:
    - cron: '0 12 * * 1-5'    # 12:00 UTC = 6:00 AM CST — morning predictions run
    - cron: '31 13 * * 1-5'   # 13:31 UTC = 9:31 AM ET during daylight saving (EDT)
    - cron: '31 14 * * 1-5'   # 14:31 UTC = 9:31 AM ET during standard time (EST)
                               # ^ both target market open; main.py checks the real
                               #   ET clock and no-ops on whichever one is "wrong"
                               #   for the current DST state — see run_market_open()
    - cron: '0 22 * * 1-5'    # 22:00 UTC = ~5/6 PM ET (buffer after 4 PM ET close) — EOD accuracy run
  workflow_dispatch:            # Allow manual trigger from GitHub Actions tab
    inputs:
      mode:
        description: 'Which pipeline mode to run'
        required: false
        default: 'predictions'
        type: choice
        options:
          - predictions
          - market_open
          - accuracy
          - backfill
          - backfill_open
      backfill_file:
        description: 'Path to a prediction JSON file under backfill_data/ (used when mode is backfill or backfill_open)'
        required: false
        default: ''
      backfill_date:
        description: 'Target date YYYY-MM-DD (only used when mode is backfill_open)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv --quiet

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "0 22 * * 1-5" ]; then
            echo "value=accuracy" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "31 13 * * 1-5" ] || [ "$SCHEDULE" = "31 14 * * 1-5" ]; then
            echo "value=market_open" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.mode || 'predictions' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          FRONTEND_REPO: ${{ secrets.FRONTEND_REPO }}
          OUTPUT_JSON_PATH: ./data.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          if [ "${{ steps.mode.outputs.value }}" = "backfill" ]; then
            python main.py --mode backfill --file "${{ github.event.inputs.backfill_file }}"
          elif [ "${{ steps.mode.outputs.value }}" = "backfill_open" ]; then
            python main.py --mode backfill_open --file "${{ github.event.inputs.backfill_file }}" --date "${{ github.event.inputs.backfill_date }}"
          else
            python main.py --mode ${{ steps.mode.outputs.value }}
          fi
