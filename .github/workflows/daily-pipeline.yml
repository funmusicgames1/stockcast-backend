name: StockCast Daily Pipeline

on:
  schedule:
    - cron: '0 12 * * 1-5'   # 12:00 UTC = 6:00 AM CST — morning predictions run
    - cron: '0 22 * * 1-5'   # 22:00 UTC = ~5/6 PM ET (buffer after 4 PM ET close) — EOD accuracy run
  workflow_dispatch:           # Allow manual trigger from GitHub Actions tab
    inputs:
      mode:
        description: 'Which pipeline mode to run'
        required: false
        default: 'predictions'
        type: choice
        options:
          - predictions
          - accuracy
          - backfill
      backfill_file:
        description: 'Path to a prediction JSON file under backfill_data/ (only used when mode is backfill)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv --quiet

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 22 * * 1-5" ]; then
            echo "value=accuracy" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.mode || 'predictions' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          FRONTEND_REPO: ${{ secrets.FRONTEND_REPO }}
          OUTPUT_JSON_PATH: ./data.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          if [ "${{ steps.mode.outputs.value }}" = "backfill" ]; then
            python main.py --mode backfill --file "${{ github.event.inputs.backfill_file }}"
          else
            python main.py --mode ${{ steps.mode.outputs.value }}
          fi
