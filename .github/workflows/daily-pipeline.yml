name: StockCast Daily Pipeline

on:
  # No `schedule:` trigger here on purpose. GitHub Actions' native cron has
  # been confirmed broken platform-wide since 2026-08-26 (see community
  # discussions #205984, #206019, #201436, #158641, #185355) -- it doesn't
  # just run late, it fires hours-delayed at unpredictable times in
  # predictions mode, each firing overwriting that day's real predictions
  # with a fresh non-deterministic AI call and desyncing it from the
  # already-captured market-open checkpoint and EOD actuals (this happened
  # for real on 2026-11-09, recovered via backfill_data/2026-11-09.json).
  # Real scheduling is handled entirely externally by cron-job.org calling
  # workflow_dispatch with an explicit mode at 7:00 AM / 9:31 AM / 6:00 PM
  # ET. Do not re-add a schedule: block without fixing this no-op risk.
  workflow_dispatch:            # Allow manual trigger from GitHub Actions tab (and from cron-job.org)
    inputs:
      mode:
        description: 'Which pipeline mode to run'
        required: false
        default: 'predictions'
        type: choice
        options:
          - predictions
          - market_open
          - accuracy
          - backfill
          - backfill_open
          - fix_prev_close
          - levels_morning
          - levels_gap
      backfill_file:
        description: 'Path to a prediction JSON file under backfill_data/ (used when mode is backfill or backfill_open)'
        required: false
        default: ''
      backfill_date:
        description: 'Target date YYYY-MM-DD (used when mode is backfill_open or fix_prev_close)'
        required: false
        default: ''

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv --quiet

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          echo "value=${{ github.event.inputs.mode || 'predictions' }}" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          FRONTEND_REPO: ${{ secrets.FRONTEND_REPO }}
          OUTPUT_JSON_PATH: ./data.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ steps.mode.outputs.value }}" = "backfill" ]; then
            python main.py --mode backfill --file "${{ github.event.inputs.backfill_file }}"
          elif [ "${{ steps.mode.outputs.value }}" = "backfill_open" ]; then
            python main.py --mode backfill_open --file "${{ github.event.inputs.backfill_file }}" --date "${{ github.event.inputs.backfill_date }}"
          elif [ "${{ steps.mode.outputs.value }}" = "fix_prev_close" ]; then
            python main.py --mode fix_prev_close --date "${{ github.event.inputs.backfill_date }}"
          else
            python main.py --mode ${{ steps.mode.outputs.value }}
          fi
